[project]
name = "tyr"
version = "0.0.1"
authors = [
  { name="Miles Bartnik", email="miles.bartnik@gmail.com" },
]
description = "Lineage and management tools for duckdb"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "duckdb",
    "python-json-logger",
    "nbformat",
    "nbconvert",
    "networkx",
    "numpy",
    "pandas",
    "rustworkx",
    "sqlparse",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
# NB: no `testpaths` -- tests/conftest.py chdirs into tests/ at collection time so the
# suite's cwd-relative config/dataset paths resolve. A `testpaths = ["tests"]` would be
# re-evaluated against that new cwd (-> tests/tests) and warn. Discovery from the pinned
# cwd finds the tests; .venv and dotdirs are excluded by pytest's defaults.

addopts = ""
python_files = ["test_*.py", "*_test.py", "test_*.ipynb"]

[project.urls]
#Homepage = "https://github.com/pypa/sampleproject"
#Issues = "https://github.com/pypa/sampleproject/issues"